name: Build and deploy Node.js app to Azure Web App - landtaxdispute-server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/qa' && 'qa' || 'development' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run database migrations
        env:
          NODE_ENV: production
          DB_HOST: ${{ github.ref == 'refs/heads/main' && secrets.DB_HOST_PROD || github.ref == 'refs/heads/qa' && secrets.DB_HOST_QA || secrets.DB_HOST_DEV }}
          DB_PORT: ${{ github.ref == 'refs/heads/main' && secrets.DB_PORT_PROD || github.ref == 'refs/heads/qa' && secrets.DB_PORT_QA || secrets.DB_PORT_DEV }}
          DB_USERNAME: ${{ github.ref == 'refs/heads/main' && secrets.DB_USERNAME_PROD || github.ref == 'refs/heads/qa' && secrets.DB_USERNAME_QA || secrets.DB_USERNAME_DEV }}
          DB_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.DB_PASSWORD_PROD || github.ref == 'refs/heads/qa' && secrets.DB_PASSWORD_QA || secrets.DB_PASSWORD_DEV }}
          DB_NAME: ${{ github.ref == 'refs/heads/main' && secrets.DB_NAME_PROD || github.ref == 'refs/heads/qa' && secrets.DB_NAME_QA || secrets.DB_NAME_DEV }}
          DB_SSL: ${{ github.ref == 'refs/heads/main' && secrets.DB_SSL_PROD || github.ref == 'refs/heads/qa' && secrets.DB_SSL_QA || secrets.DB_SSL_DEV }}
        run: npm run migration:run

      - name: Prepare deployment package
        run: |
          mkdir -p deployment
          cp -r dist deployment/dist
          cp package.json deployment/package.json
          cp package-lock.json deployment/package-lock.json

          cat > deployment/oryx-manifest.toml << 'EOF'
          [build]
          operationId = "github-actions-build"
          buildCommands = []
          EOF

          cat > deployment/.oryxignore << 'EOF'
          node_modules.tar.gz
          EOF

      - name: Cache production node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: deployment/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install production dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          cd deployment
          npm ci --omit=dev

      - name: Verify deployment package
        run: |
          echo "=== Deployment folder ==="
          ls -la deployment/
          echo "=== node_modules check ==="
          ls deployment/node_modules | head -5 || echo "NO NODE_MODULES FOUND!"
          echo "=== Zip size ==="
          du -sh deployment/

      - name: Zip deployment package
        run: |
          cd deployment
          zip -r ../deployment.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'landtaxdispute-server'
          slot-name: 'Production'
          package: deployment.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A76461515FA9422A88808EE1E33679FD }}
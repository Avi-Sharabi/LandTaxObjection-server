name: Build and deploy Node.js app to Azure Web App - landtaxdispute-server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/qa' && 'qa' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # Run migrations (only main safe guard recommended)
      - name: Run database migrations
        if: github.ref == 'refs/heads/main'
        env:
          NODE_ENV: production

          DB_HOST: ${{ secrets.DB_HOST_PROD }}
          DB_PORT: ${{ secrets.DB_PORT_PROD }}
          DB_USERNAME: ${{ secrets.DB_USERNAME_PROD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_PROD }}
          DB_NAME: ${{ secrets.DB_NAME_PROD }}
          DB_SSL: ${{ secrets.DB_SSL_PROD }}

        run: npm run migration:run

      # ❌ FIX: REMOVE custom deployment folder (this was breaking SCM deploy)
      # Azure Run-From-Package expects a normal app root structure

      - name: Prepare deployment package
        run: |
          rm -rf deployment
          mkdir deployment
          cp -r dist deployment/
          cp package.json deployment/
          cp package-lock.json deployment/

      # ✅ FIX: install production deps inside deployment
      - name: Install production dependencies
        run: |
          cd deployment
          npm ci --omit=dev

      # ✅ FIX: prevent SCM restart conflict
      - name: Wait before deploy
        run: sleep 30

      # Deploy
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: landtaxdispute-server
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISHPROFILE_A76461515FA9422A88808EE1E33679FD }}
          package: deployment